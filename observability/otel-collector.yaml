receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    limit_mib: 512
    spike_limit_mib: 128
    check_interval: 5s
  batch:
    timeout: 1s
    send_batch_size: 1024

  # Loki label policy (blueprint section 16): promote only approved
  # low-cardinality fields to indexed labels via the loki.* hint
  # attributes; trace/request/session/user IDs and other high-cardinality
  # values stay in the log body.
  attributes/loki_labels:
    actions:
      - action: insert
        key: loki.attribute.labels
        value: source,severity,event.category,event.name,event.outcome,dependency.provider,dependency.service
  resource/loki_labels:
    attributes:
      - action: insert
        key: loki.resource.labels
        value: service.name,deployment.environment

exporters:
  # Traces → Tempo
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  # Metrics → Prometheus scrapes this endpoint
  prometheus:
    endpoint: "0.0.0.0:8889"
    namespace: foodapp
    send_timestamps: true
    metric_expiration: 3m
    # Keep the blueprint metric names (e.g. http_server_request_duration_ms)
    # instead of appending unit/_total suffixes.
    add_metric_suffixes: false

  # Logs → Loki
  loki:
    endpoint: http://loki:3100/loki/api/v1/push
    default_labels_enabled:
      exporter: false
      job: true
      level: true

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  pprof:
    endpoint: 0.0.0.0:1777

service:
  extensions: [health_check, pprof]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource/loki_labels, attributes/loki_labels, batch]
      exporters: [loki]
